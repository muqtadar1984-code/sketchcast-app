name: autofix

# Triggered by POST /api/autofix/dispatch (repository_dispatch). Claude Code writes a
# minimal fix on a branch, we run the quality gates, open a PR (never merge), and call
# back the app so it emails the founder the signed Approve/Reject links.
#
# ── One-time setup (see docs/AUTOFIX.md) ──
# Repo secrets: AUTOFIX_CALLBACK_SECRET, AUTOFIX_APP_URL (+ ANTHROPIC_API_KEY until Bedrock)
# Repo variable: AUTOFIX_AWS_ROLE_ARN — when set, Claude Code runs on Amazon Bedrock
#   (AWS Activate credits) through GitHub OIDC: no AWS key is stored anywhere. Unset,
#   the run falls back to ANTHROPIC_API_KEY exactly as before. Setup: docs/AUTOFIX.md.
# Enable Actions on the repo. The default GITHUB_TOKEN below opens the PR; the app's
# own GITHUB_AUTOFIX_TOKEN (in Vercel) is what later merges it on your approval.

on:
  repository_dispatch:
    types: [autofix]

permissions:
  contents: write
  pull-requests: write
  id-token: write   # GitHub OIDC → sts:AssumeRoleWithWebIdentity for Bedrock

concurrency:
  group: autofix-${{ github.event.client_payload.run_key }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      RUN_KEY: ${{ github.event.client_payload.run_key }}
      BRANCH: ${{ github.event.client_payload.branch }}
      APP_URL: ${{ secrets.AUTOFIX_APP_URL }}
      CALLBACK_SECRET: ${{ secrets.AUTOFIX_CALLBACK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create fix branch
        run: git switch -c "$BRANCH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bedrock credentials: GitHub's OIDC token is exchanged for 1-hour role
      # credentials (role trusts only this repo). Skipped while the variable is
      # unset, so a dispatch before the AWS setup still runs on the API key.
      - name: AWS credentials for Bedrock (OIDC)
        if: vars.AUTOFIX_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AUTOFIX_AWS_ROLE_ARN }}
          role-session-name: sketchcast-autofix
          aws-region: us-east-1

      # Claude Code writes the fix. `model` is pinned explicitly: the action's own
      # default was a RETIRED id (claude-sonnet-4-20250514 → 404, first smoke test),
      # so never rely on it. claude-sonnet-5 is the same model the app's assistant
      # runs in prod. On Bedrock the id is the cross-region inference profile — the
      # bare first-party id is refused there — and Claude Code's background (Haiku)
      # model is pinned to a profile the role may invoke. `allowed_tools` is this
      # action's real input name — `claude_args` is not an input and was silently ignored.
      - name: Claude Code — write the fix
        uses: anthropics/claude-code-base-action@beta
        env:
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.AUTOFIX_AWS_ROLE_ARN != '' && 'us.anthropic.claude-haiku-4-5-20251001-v1:0' || '' }}
        with:
          use_bedrock: ${{ vars.AUTOFIX_AWS_ROLE_ARN != '' && 'true' || 'false' }}
          anthropic_api_key: ${{ vars.AUTOFIX_AWS_ROLE_ARN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          model: ${{ vars.AUTOFIX_AWS_ROLE_ARN != '' && 'us.anthropic.claude-sonnet-5' || 'claude-sonnet-5' }}
          allowed_tools: "Edit,Write,Read,Bash,Grep,Glob"
          prompt: |
            You are fixing a real customer-reported bug in this Next.js 16 / React 19 app.
            Read AGENTS.md first. Reproduce the problem, then make the SMALLEST correct fix.
            Add or adjust a Vitest test that would have caught it. Keep the change tightly
            scoped to the reported issue. Do NOT touch auth, billing, database migrations,
            middleware, or secrets unless it is truly essential — and if you must, say so
            clearly. When done, ensure `npx tsc --noEmit`, `npx eslint`, and `npx vitest run`
            all pass. Here is the report:

            ${{ github.event.client_payload.brief }}

      - name: Quality gates
        id: gates
        run: |
          set +e
          npx tsc --noEmit;   TSC=$?
          npx eslint .;       LINT=$?
          npx vitest run;     TEST=$?
          echo "tsc=$TSC eslint=$LINT vitest=$TEST"
          if [ $TSC -eq 0 ] && [ $LINT -eq 0 ] && [ $TEST -eq 0 ]; then
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes + sensitive paths
        id: diff
        run: |
          # The claude-code-base-action writes its own execution artifacts into the
          # workspace (output.txt = the agent's transcript, NOT a fix). Run
          # ee0fb99628f13098 staged it with `git add -A` and shipped it as the ENTIRE
          # PR (#24). Scrub the artifacts first, and exclude them from the add as a
          # second fence in case the action renames them.
          rm -f output.txt claude-code-output* claude_output* claude-execution-output*
          git add -A -- ':!output.txt' ':!claude-code-output*' ':!claude_output*' ':!claude-execution-output*'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Empty fix — after scrubbing the action's own artifacts the agent produced NO code changes. Refusing to open a PR; this run needs a human."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          FILES=$(git diff --cached --name-only | head -50)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$FILES" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$FILES" | grep -Eq '(auth|billing|middleware|supabase/migrations|stripe|lemonsqueezy|rls)'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push + open PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "sketchcast-autofix[bot]"
          git config user.email "noreply@sketchcast.app"
          git commit -m "Auto-fix: address reported issue (run $RUN_KEY)"
          git push origin "$BRANCH"
          CI="${{ steps.gates.outputs.ci_passed }}"
          BODY="Automated fix for a reported issue (run \`$RUN_KEY\`).\n\nCI: $CI\n\n**DO NOT MERGE manually** — approve via the email link so the app records it."
          URL=$(gh pr create --base main --head "$BRANCH" --title "Auto-fix: run $RUN_KEY (CI: $CI)" --body "$(printf "%b" "$BODY")")
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(gh pr view "$URL" --json number -q .number)" >> "$GITHUB_OUTPUT"

      # This callback is what flips autofix_runs off "dispatched" and sends the
      # founder the Approve/Reject email. A non-2xx answer MUST turn the job red:
      # run ee0fb99628f13098 got a 401 (secret mismatch) here, exited green, and
      # the run sat "dispatched" forever with no email. --fail-with-body makes
      # curl exit non-zero on HTTP >= 400 while still printing the app's error.
      - name: Call back the app
        if: always()
        run: |
          CHANGED="${{ steps.diff.outputs.changed }}"
          CI="${{ steps.gates.outputs.ci_passed }}"
          if [ "$CHANGED" != "true" ]; then CI="false"; SUMMARY="The agent produced no code changes for this report."; else SUMMARY="See the pull request for the diff."; fi
          BODY_FILE="$RUNNER_TEMP/autofix-callback-body.txt"
          set +e
          HTTP_CODE=$(jq -n \
            --arg run_key "$RUN_KEY" \
            --arg pr_url "${{ steps.pr.outputs.pr_url }}" \
            --argjson pr_number "${{ steps.pr.outputs.pr_number || 'null' }}" \
            --argjson ci_passed "${CI:-false}" \
            --argjson sensitive "${{ steps.diff.outputs.sensitive || 'false' }}" \
            --arg summary "$SUMMARY" \
            '{run_key:$run_key, pr_url:$pr_url, pr_number:$pr_number, ci_passed:$ci_passed, sensitive:$sensitive, summary:$summary}' \
          | curl -sS --fail-with-body -o "$BODY_FILE" -w '%{http_code}' \
              -X POST "$APP_URL/api/autofix/pr-opened" \
              -H "content-type: application/json" \
              -H "x-autofix-secret: $CALLBACK_SECRET" \
              --data @-)
          CURL_RC=$?
          set -e
          cat "$BODY_FILE" 2>/dev/null || true
          if [ "$CURL_RC" -ne 0 ]; then
            echo "::error::Callback FAILED — POST /api/autofix/pr-opened answered HTTP ${HTTP_CODE:-000} (curl exit $CURL_RC). The autofix_runs row is still 'dispatched' and no approval email was sent. Check AUTOFIX_CALLBACK_SECRET (401 = secret mismatch with Vercel) and AUTOFIX_APP_URL."
            exit 1
          fi
          echo "Callback OK — POST /api/autofix/pr-opened answered HTTP $HTTP_CODE"
